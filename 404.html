<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Tomo Interactive</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>
(function(){try{var t=localStorage.getItem('ti-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
  .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; }
  .notfound .code {
    font-family: var(--font-display); font-size: clamp(5rem, 18vw, 10rem); font-weight: 700;
    line-height: 1; margin-bottom: 8px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .notfound h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); margin-bottom: 14px; }
  .notfound p { color: var(--text-muted); max-width: 420px; margin: 0 auto 32px; }
</style>
</head>
<body>
  <main class="notfound">
    <div class="hero-bg" aria-hidden="true">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
    </div>
    <div class="container" style="position:relative">
      <p class="code">404</p>
      <h1>This page doesn't exist.</h1>
      <p>The link may be out of date, or the page has moved. Let's get you back on track.</p>
      <a class="btn btn-primary" href="/">Back to homepage</a>
    </div>
  </main>
</body>
</html>
